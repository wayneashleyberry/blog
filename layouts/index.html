<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Wayne Ashley Berry</title>

  {{ if hugo.IsProduction }}
  {{ $css := resources.Get "css/style.min.css" }}
  {{ $secureCSS := $css | resources.Fingerprint "md5" }}
  <link href="{{ $secureCSS.Permalink }}" integrity="{{ $secureCSS.Data.Integrity }}" rel="stylesheet">
  {{ else }}
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  {{ end }}
</head>

<body>
  <div class="container mx-auto">
    <main class="m-4 md:m-0">
      <h1 class="font-bold mt-16 mb-8">Contents</h1>

      <ul class="font-serif">
        {{ range where .Site.RegularPages "Section" "posts" }}
          <li><a class="underline" href="{{ .Permalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ol>
    </main>
  </div>

  <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt=""
      referrerpolicy="no-referrer-when-downgrade" /></noscript>
</body>

</html>
