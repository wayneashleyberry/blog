<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>{{ .Title }} by Wayne Ashley Berry</title>

  <meta name="description" content="{{ .Summary }}" />
  <meta name="author" content="Wayne Ashley Berry" />
  <meta name="twitter:title" content="{{ .Title }}" />
  <meta name="twitter:description" content="{{ .Summary }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@waynethebrain" />
  <meta name="twitter:creator" content="@waynethebrain" />

  {{ if hugo.IsProduction }}
  {{ $css := resources.Get "css/style.min.css" }}
  {{ $secureCSS := $css | resources.Fingerprint "md5" }}
  <link href="{{ $secureCSS.Permalink }}" integrity="{{ $secureCSS.Data.Integrity }}" rel="stylesheet">
  {{ else }}
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  {{ end }}
</head>

<body>
  <main class="container mx-auto">
    <article class="mb-16">
      <h1 class="font-bold mt-16 mb-8">{{ .Title }}</h1>

      <div class="prose font-serif">{{ .Content }}</div>
    </article>
  </main>

  <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt=""
      referrerpolicy="no-referrer-when-downgrade" /></noscript>
</body>

</html>
